name: package
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 3) - creates release v<number>"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir raghad-nouh-site
          cat site.tar.part* | tar -xf - -C raghad-nouh-site
          if [ -f index.html ]; then cp index.html raghad-nouh-site/index.html; fi
          if [ -f update.tar ]; then tar -xf update.tar -C raghad-nouh-site; fi
          # V6 overlay: new page, cleaned paintings, teasers, CV, logos, protection tools
          if ls v6.tar.part* >/dev/null 2>&1; then cat v6.tar.part* | tar -xf - -C raghad-nouh-site; fi
          # V6 rights protection: bake the RN watermark into every work image/page and rebuild PDFs (CV excluded)
          pip install -q --break-system-packages pillow
          if [ -f raghad-nouh-site/tools/protect.py ]; then python3 raghad-nouh-site/tools/protect.py raghad-nouh-site && rm -rf raghad-nouh-site/tools; fi
          mkdir -p raghad-nouh-site/assets/lib
          curl -fsSL -o raghad-nouh-site/assets/lib/pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js || true
          curl -fsSL -o raghad-nouh-site/assets/lib/pdf.worker.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js || true
          curl -fsSL -o raghad-nouh-site/assets/lib/hls.min.js https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js || true
          ls -la raghad-nouh-site/assets/lib
          zip -q -r -0 raghad-nouh-site.zip raghad-nouh-site
          ls -lh raghad-nouh-site.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete site -y --cleanup-tag || true
          gh release create site raghad-nouh-site.zip --title "Raghad Nouh site (full)" --notes "Full site folder in one zip." --latest
          V="${{ github.event.inputs.version }}"
          if [ -n "$V" ]; then
            cp raghad-nouh-site.zip "raghad-nouh-site-v$V.zip"
            gh release delete "v$V" -y --cleanup-tag || true
            gh release create "v$V" "raghad-nouh-site-v$V.zip" --title "Raghad Nouh site - v$V" --notes "Full site (all images, videos, PDFs) - version $V." --latest=false
          fi
