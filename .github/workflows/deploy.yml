name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site && cat site.tar.part* | tar -xf - -C _site && touch _site/.nojekyll
          sed -i 's#content="og.png"#content="https://raghadnouh.github.io/og.png"#' _site/index.html
          sed -i 's#<meta property="og:type"#<meta property="og:url" content="https://raghadnouh.github.io/"/>\n<meta property="og:type"#' _site/index.html
          grep -o 'og:[a-z]*" content="[^"]*' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
